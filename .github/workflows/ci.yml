name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  AWS_REGION: ap-northeast-2
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  BACKEND_REPOSITORY: insite-backend
  FRONTEND_REPOSITORY: insite-frontend

jobs:

  backend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: |
          docker build \
            --no-cache \
            -t insite-backend:ci \
            ./back-end


  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build frontend Docker image
        run: |
          docker build \
            --no-cache \
            -t insite-frontend:ci \
            ./front-end


  push-images:
    if: github.event_name == 'push'
    needs:
      - backend-build
      - frontend-build

    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}

        run: |
          docker build \
            -t $ECR_REGISTRY/$BACKEND_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$BACKEND_REPOSITORY:latest \
            ./back-end

          docker push $ECR_REGISTRY/$BACKEND_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$BACKEND_REPOSITORY:latest

      - name: Build and push frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}

        run: |
          docker build \
            -t $ECR_REGISTRY/$FRONTEND_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$FRONTEND_REPOSITORY:latest \
            ./front-end

          docker push $ECR_REGISTRY/$FRONTEND_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$FRONTEND_REPOSITORY:latest


  deploy:
    if: github.event_name == 'push'
    needs:
      - push-images

    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/insite-key.pem
          chmod 600 ~/.ssh/insite-key.pem

      - name: Add EC2 host key
        run: |
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh \
            -i ~/.ssh/insite-key.pem \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF

              set -e

              cd ~/insite-deploy

              git pull

              aws ecr get-login-password --region ${AWS_REGION} \
              | docker login \
                --username AWS \
                --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com

              sed -i \
                "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${BACKEND_REPOSITORY}:latest|" \
                .env

              sed -i \
                "s|^FRONTEND_IMAGE=.*|FRONTEND_IMAGE=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${FRONTEND_REPOSITORY}:latest|" \
                .env

              docker compose pull
              docker compose up -d
              docker compose ps

          EOF
