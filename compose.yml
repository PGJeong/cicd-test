services:

  nginx:
    image: nginx:1.27
    container_name: insite-nginx
    restart: unless-stopped

    depends_on:
      - frontend
      - backend

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro


  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: insite-frontend
    restart: unless-stopped

    environment:
      SEOUL_OPENAPI_KEY: ${SEOUL_OPENAPI_KEY}

    expose:
      - "3000"


  backend:
    image: ${BACKEND_IMAGE}
    container_name: insite-backend
    restart: unless-stopped

    depends_on:
      redis:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://${RDS_HOST}:3306/${DB_NAME}?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}

      JWT_SECRET_KEY: ${JWT_SECRET}
      JWT_ACCESS_EXPIRE_TIME: ${JWT_ACCESS_EXPIRE_TIME}
      JWT_REFRESH_EXPIRE_TIME: ${JWT_REFRESH_EXPIRE_TIME}

      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}

      GMS_API_KEY: ${GMS_API_KEY}
      GMS_BASE_URL: ${GMS_BASE_URL}

    expose:
      - "8080"


  redis:
    image: redis:7
    container_name: insite-redis
    restart: unless-stopped

    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"

    volumes:
      - redis-data:/data

    healthcheck:
      test:
        - CMD
        - redis-cli
        - -a
        - ${REDIS_PASSWORD}
        - ping
      interval: 10s
      timeout: 3s
      retries: 5


volumes:
  redis-data:
  